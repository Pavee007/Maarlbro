<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg-deep:#080810;
  --bg-card:rgba(255,255,255,0.06);
  --card-border:rgba(255,255,255,0.1);
  --rose:#e84393;
  --rose-soft:#ff6b9d;
  --violet:#a855f7;
  --gold:#f0c040;
  --white:#ffffff;
  --white-60:rgba(255,255,255,0.6);
  --white-30:rgba(255,255,255,0.3);
  --glow-rose:rgba(232,67,147,0.35);
  --glow-violet:rgba(168,85,247,0.25);
}

body{
  margin:0;overflow:hidden;
  font-family:'Inter',sans-serif;
  background:var(--bg-deep);
  color:var(--white);
  height:100vh;width:100vw;
  display:flex;align-items:center;justify-content:center;
}

/* Ambient glow orbs */
.orb{
  position:fixed;border-radius:50%;
  filter:blur(120px);pointer-events:none;
  animation:drift 12s ease-in-out infinite alternate;
}
.orb-1{width:500px;height:500px;background:var(--glow-rose);top:-10%;left:-10%;animation-delay:0s}
.orb-2{width:400px;height:400px;background:var(--glow-violet);bottom:-15%;right:-10%;animation-delay:-4s}
.orb-3{width:300px;height:300px;background:rgba(240,192,64,0.12);top:50%;left:60%;animation-delay:-8s}

@keyframes drift{
  0%{transform:translate(0,0) scale(1)}
  100%{transform:translate(40px,30px) scale(1.15)}
}

/* Stars */
canvas#stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}

/* Hearts */
.heart{
  position:fixed;z-index:1;pointer-events:none;
  width:12px;height:12px;
  background:var(--rose-soft);
  transform:rotate(45deg);
  opacity:0;
  animation:heartFloat linear forwards;
}
.heart::before,.heart::after{
  content:'';position:absolute;
  width:12px;height:12px;
  background:inherit;border-radius:50%;
}
.heart::before{top:-6px;left:0}
.heart::after{left:-6px;top:0}

@keyframes heartFloat{
  0%{opacity:0;transform:translateY(0) rotate(45deg) scale(0.5)}
  10%{opacity:0.7}
  90%{opacity:0.3}
  100%{opacity:0;transform:translateY(-100vh) rotate(45deg) scale(1)}
}

/* Dialog Card */
.dialog{
  position:relative;z-index:10;
  width:min(420px,90vw);
  padding:48px 36px 40px;
  border-radius:24px;
  background:var(--bg-card);
  border:1px solid var(--card-border);
  backdrop-filter:blur(40px) saturate(1.4);
  -webkit-backdrop-filter:blur(40px) saturate(1.4);
  text-align:center;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.05) inset,
    0 24px 80px rgba(0,0,0,0.5),
    0 0 120px var(--glow-rose);
  animation:cardIn 0.8s cubic-bezier(.16,1,.3,1) both;
}

@keyframes cardIn{
  from{opacity:0;transform:translateY(30px) scale(0.96)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

.dialog .eyebrow{
  display:inline-block;
  font-size:11px;font-weight:600;
  letter-spacing:2.5px;text-transform:uppercase;
  color:var(--rose-soft);
  margin-bottom:16px;
}

.dialog h2{
  font-family:'Playfair Display',serif;
  font-size:32px;font-weight:700;
  line-height:1.25;
  margin-bottom:8px;
  background:linear-gradient(135deg,var(--white) 40%,var(--rose-soft));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}

.dialog .subtitle{
  font-size:14px;color:var(--white-60);
  line-height:1.6;margin-bottom:32px;
  font-weight:300;
}

.btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

.btn{
  padding:14px 32px;
  border-radius:14px;
  border:none;cursor:pointer;
  font-family:'Inter',sans-serif;
  font-size:15px;font-weight:600;
  letter-spacing:0.3px;
  transition:all 0.3s cubic-bezier(.16,1,.3,1);
  position:relative;overflow:hidden;
}

.btn-yes{
  background:linear-gradient(135deg,var(--rose),var(--violet));
  color:var(--white);
  box-shadow:0 4px 24px var(--glow-rose),0 0 0 0 var(--rose);
}
.btn-yes:hover{
  transform:translateY(-2px) scale(1.04);
  box-shadow:0 8px 40px var(--glow-rose),0 0 0 2px var(--rose-soft);
}

.btn-no{
  background:rgba(255,255,255,0.08);
  color:var(--white-60);
  border:1px solid var(--card-border);
}
.btn-no:hover{
  background:rgba(255,255,255,0.12);
  color:var(--white);
}

.tease-msg{
  margin-top:20px;
  font-size:13px;
  color:var(--rose-soft);
  opacity:0;
  transition:all 0.4s ease;
  font-style:italic;
}
.tease-msg.show{opacity:1}

/* Lyrics overlay */
#lyrics-overlay{
  position:fixed;inset:0;z-index:20;
  display:none;
  flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;
}

#lyric-line{
  font-family:'Playfair Display',serif;
  font-size:clamp(24px,5vw,40px);
  font-weight:400;font-style:italic;
  line-height:1.4;
  opacity:0;
  max-width:600px;
  transition:all 0.6s ease;
}
#lyric-line.visible{opacity:1;transform:translateY(0)}
#lyric-line.hidden{opacity:0;transform:translateY(20px)}

/* Proposal */
#proposal-overlay{
  position:fixed;inset:0;z-index:25;
  display:none;
  flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;
}

#proposal-text{
  font-family:'Playfair Display',serif;
  font-size:clamp(28px,6vw,48px);
  font-weight:700;
  line-height:1.3;
  background:linear-gradient(135deg,var(--white),var(--rose-soft),var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  max-width:700px;
}

#proposal-sub{
  margin-top:16px;
  font-size:16px;
  color:var(--white-60);
  opacity:0;
  transition:opacity 1s ease 0.5s;
}

/* Ring emoji bounce */
.ring-anim{
  font-size:48px;
  margin-bottom:20px;
  animation:ringBounce 1.5s ease infinite;
  display:inline-block;
}
@keyframes ringBounce{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-12px) scale(1.15)}
}

/* Heart burst */
.burst-heart{
  position:fixed;z-index:15;pointer-events:none;
  width:14px;height:14px;
  background:var(--rose);
  transform:rotate(45deg);
  animation:burstOut 1s cubic-bezier(.16,1,.3,1) forwards;
}
.burst-heart::before,.burst-heart::after{
  content:'';position:absolute;
  width:14px;height:14px;
  background:inherit;border-radius:50%;
}
.burst-heart::before{top:-7px}
.burst-heart::after{left:-7px}

@keyframes burstOut{
  0%{opacity:1;transform:rotate(45deg) scale(1) translate(0,0)}
  100%{opacity:0;transform:rotate(45deg) scale(0.4) translate(var(--tx),var(--ty))}
}

/* YouTube hidden */
iframe#ytplayer{position:fixed;width:0;height:0;border:0;opacity:0;pointer-events:none}

/* Responsive */
@media(max-width:480px){
  .dialog{padding:36px 24px 32px}
  .dialog h2{font-size:26px}
  .btn{padding:12px 24px;font-size:14px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important}
}
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<canvas id="stars"></canvas>

<iframe id="ytplayer" allow="autoplay"></iframe>

<div class="dialog" id="dialog">
  <span class="eyebrow">a question for you</span>
  <h2>Do You Need Me? 💖</h2>
  <p class="subtitle">Some things in life only need one answer.</p>
  <div class="btn-row">
    <button class="btn btn-yes" id="yesBtn">Yes, I do 😍</button>
    <button class="btn btn-no" id="noBtn">Hmm, No 🙃</button>
  </div>
  <p class="tease-msg" id="teaseMsg">Nice try... you don't have that option 😏</p>
</div>

<div id="lyrics-overlay">
  <p id="lyric-line"></p>
</div>

<div id="proposal-overlay">
  <span class="ring-anim">💍</span>
  <p id="proposal-text"></p>
  <p id="proposal-sub">— forever & always ❤️</p>
</div>

<script>
// ── Stars ──
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
let stars = [];

function initStars(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  stars = Array.from({length:120},()=>({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:Math.random()*1.4+0.3,
    a:Math.random(),
    da:(Math.random()-0.5)*0.008
  }));
}
function drawStars(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  stars.forEach(s=>{
    s.a+=s.da;
    if(s.a>1||s.a<0.1)s.da*=-1;
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${s.a})`;
    ctx.fill();
  });
  requestAnimationFrame(drawStars);
}
initStars();drawStars();
window.addEventListener('resize',initStars);

// ── Floating Hearts ──
const heartColors = ['#e84393','#ff6b9d','#a855f7','#f0c040','rgba(255,255,255,0.5)'];
setInterval(()=>{
  const h = document.createElement('div');
  h.className='heart';
  h.style.left=Math.random()*100+'vw';
  h.style.bottom='-20px';
  h.style.background=heartColors[Math.floor(Math.random()*heartColors.length)];
  h.style.animationDuration=(4+Math.random()*4)+'s';
  h.style.width=h.style.height=(8+Math.random()*10)+'px';
  const sz=parseFloat(h.style.width);
  h.querySelectorAll; // force reflow
  h.style.setProperty('--sz',sz+'px');
  // fix pseudo size via inline
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),8000);
},350);

// ── No Button Tease ──
const noBtn = document.getElementById('noBtn');
const teaseMsg = document.getElementById('teaseMsg');
const dialog = document.getElementById('dialog');

const teases = [
  "Nice try… you don't have that option 😏",
  "Nope, not happening 💅",
  "You really thought? 😂",
  "The only answer is Yes 💖",
  "I'll wait… forever if I have to ✨",
  "Wrong button, love 🫶"
];
let teaseIdx = 0;

noBtn.addEventListener('pointerenter',()=>{
  const rect = dialog.getBoundingClientRect();
  const pad = 20;
  const maxX = rect.width - noBtn.offsetWidth - pad;
  const maxY = rect.height - noBtn.offsetHeight - pad;
  noBtn.style.position='absolute';
  noBtn.style.left = (pad + Math.random()*maxX) + 'px';
  noBtn.style.top = (pad + Math.random()*maxY) + 'px';
  teaseMsg.textContent = teases[teaseIdx % teases.length];
  teaseMsg.classList.add('show');
  teaseIdx++;
});

// ── YouTube ──
const videoID = "jifBuWCqGJ8";
function playMusic(){
  document.getElementById('ytplayer').src =
    `https://www.youtube.com/embed/${videoID}?autoplay=1&loop=1&playlist=${videoID}`;
}

// ── YES Flow ──
document.getElementById('yesBtn').addEventListener('click',()=>{
  playMusic();

  // Heart burst
  for(let i=0;i<60;i++){
    const b=document.createElement('div');
    b.className='burst-heart';
    const angle=Math.random()*Math.PI*2;
    const dist=100+Math.random()*250;
    b.style.setProperty('--tx',Math.cos(angle)*dist+'px');
    b.style.setProperty('--ty',Math.sin(angle)*dist+'px');
    b.style.left='50%';b.style.top='50%';
    b.style.background=heartColors[Math.floor(Math.random()*heartColors.length)];
    document.body.appendChild(b);
    setTimeout(()=>b.remove(),1200);
  }

  // Fade out dialog
  dialog.style.transition='all 0.6s ease';
  dialog.style.opacity='0';
  dialog.style.transform='translate(-50%,-50%) scale(0.9)';
  setTimeout(()=>{dialog.style.display='none'},600);

  setTimeout(startLyrics,800);
});

// ── Lyrics ──
const lyricsData = [
  {time:0, text:"This song… is for you 💖"},
  {time:5, text:"Every heartbeat feels different now…"},
  {time:10, text:"Because you're in my world 🌍"},
  {time:15, text:"And I don't ever want to lose you ❤️"}
];

function startLyrics(){
  const overlay = document.getElementById('lyrics-overlay');
  const line = document.getElementById('lyric-line');
  overlay.style.display='flex';

  lyricsData.forEach((l,i)=>{
    setTimeout(()=>{
      line.className='hidden';
      setTimeout(()=>{
        line.textContent=l.text;
        line.className='visible';
      },400);
    },l.time*1000);
  });

  setTimeout(()=>{
    overlay.style.transition='opacity 0.8s';
    overlay.style.opacity='0';
    setTimeout(()=>{overlay.style.display='none';showProposal()},800);
  },21000);
}

// ── Proposal ──
function showProposal(){
  const overlay = document.getElementById('proposal-overlay');
  const text = document.getElementById('proposal-text');
  const sub = document.getElementById('proposal-sub');
  overlay.style.display='flex';
  overlay.style.opacity='0';
  overlay.style.transition='opacity 0.8s';
  requestAnimationFrame(()=>{overlay.style.opacity='1'});

  const msg = "Will you be mine forever?";
  let i=0;
  const typing = setInterval(()=>{
    text.textContent += msg[i];
    i++;
    if(i>=msg.length){
      clearInterval(typing);
      sub.style.opacity='1';
    }
  },90);
}
</script>
</body>
</html>
